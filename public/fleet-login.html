<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pondy Fleet — เข้าระบบ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,Segoe UI,Roboto,"Noto Sans Thai",sans-serif;color:#e8ecff;
    background:radial-gradient(900px 500px at 50% -10%,#1a1340,#070811 60%),#070811}
  .card{width:330px;background:linear-gradient(180deg,#141838,#0f1330);border:1px solid #222a52;
    border-radius:20px;padding:30px 26px;box-shadow:0 0 0 1px #7c5cff22,0 30px 80px -30px #7c5cff66}
  .logo{font-weight:800;font-size:24px;text-align:center;margin-bottom:6px}
  .logo b{color:#7c5cff;text-shadow:0 0 18px #7c5cff88}
  .logo .v{font-size:12px;color:#22e0e0;vertical-align:super}
  .sub{text-align:center;color:#8b93c7;font-size:13px;margin-bottom:22px}
  input{width:100%;background:#0b0e22;border:1px solid #222a52;color:#e8ecff;border-radius:12px;
    padding:13px 14px;font-size:15px;outline:none}
  input:focus{border-color:#7c5cff}
  .pw{position:relative}
  .pw input{padding-right:48px}
  .pw .eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:36px;height:36px;margin:0;padding:0;
    display:grid;place-items:center;background:none;border:none;box-shadow:none;border-radius:9px;color:#8b93c7;cursor:pointer}
  .pw .eye:hover{color:#e8ecff;background:#ffffff0d;filter:none}
  .pw .eye:focus-visible{outline:2px solid #7c5cff;outline-offset:1px}
  .pw .eye svg{width:20px;height:20px}
  .pw .eye .off{display:none}
  .pw .eye[aria-pressed="true"] .on{display:none}
  .pw .eye[aria-pressed="true"] .off{display:block}
  button[type=submit]{width:100%;margin-top:14px;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;
    color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#a35cff);box-shadow:0 0 20px #7c5cff66}
  button:hover{filter:brightness(1.1)}
  .err{color:#ff5a7a;text-align:center;font-size:13px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
  <form class="card" method="post" action="/fleet/login">
    <div class="logo">🛰️ PONDY <b>FLEET</b><span class="v">v2</span></div>
    <div class="sub">ระบบคุมมือถือฟาร์มคลิป</div>
    <div class="pw">
      <input type="password" name="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" autofocus />
      <button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน" aria-pressed="false" title="แสดงรหัสผ่าน">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.5 5 12 5s10.2 7 10.2 7-3.7 7-10.2 7S1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10.2 7 10.2 7a17.6 17.6 0 0 1-2.9 3.8"/><path d="M6.6 6.6C3.4 8.6 1.8 12 1.8 12s3.7 7 10.2 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
      </button>
    </div>
    <button type="submit">เข้าระบบ</button>
    <div class="err" id="err"></div>
  </form>
<script>
  // ปุ่มตา: สลับ password ↔ text แล้วคืนโฟกัส + ตำแหน่งเคอร์เซอร์ให้พิมพ์ต่อได้เลย
  var pw=document.getElementById('pw'),eye=document.getElementById('eye');
  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.setAttribute('aria-pressed',show?'true':'false');
    eye.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน');
    eye.title=eye.getAttribute('aria-label');
    var n=pw.value.length;pw.focus();try{pw.setSelectionRange(n,n);}catch(e){}
  });
  // ส่งฟอร์มแล้วกลับเป็นซ่อนเสมอ กันเบราว์เซอร์จำช่องเป็นแบบ text
  pw.form.addEventListener('submit',function(){pw.type='password';});
  var s=location.search;
  if(s.indexOf('e=2')>=0)document.getElementById('err').textContent='พยายามเข้าระบบบ่อยเกินไป — รอสักครู่แล้วลองใหม่';
  else if(s.indexOf('e=1')>=0)document.getElementById('err').textContent='รหัสผ่านไม่ถูกต้อง';
</script>
</body>
</html>
